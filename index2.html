<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capstone Project -2026</title>
    <!-- link the tailwind css with cdn script tag -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <div class="md:flex flex-col w-60 bg-gray-700 text-white p-6">
        <h2 class="text-xl font-bold mb-6">[logo] Capstone Flow</h2>

        <ol class="space-y-3">
          <li class="block p-2 rounded bg-gray-800">Dashboard</li>
          <li class="block p-2 hover:bg-gray-700 rounded">Settings</li>
        </ol>
      </div>

      <!-- ✅ MOVE MAIN CONTENT INSIDE -->
      <div class="flex-1 p-6">
        <!-- header -->
        <div class="flex justify-between items-center mb-6">
          <div>
            <h1 class="text-2xl font-bold">Dashboard</h1>
            <p class="text-gray-400">Track and Manage the Tasks</p>
          </div>

          <button class="bg-blue-500 text-white px-4 py-2 rounded">
            Add Task
          </button>
        </div>
      </div>
    </div>

</html>
