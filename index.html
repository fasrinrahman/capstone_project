<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capstone Project -2026</title>
    <!-- link the tailwind css with cdn script tag -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <!-- main home screen start -->
    <div class="flex min-h-screen">
      <!-- sidebar start -->
      <div class="md:flex flex-col w-60 bg-gray-700 text-white p-6">
        <h2 class="text-xl font-bold mb-6">Capstone Flow</h2>
        <!-- sidebar menu list start -->
        <ol class="space-y-3">
          <li class="block p-2 rounded bg-gray-800">Dashboard</li>
          <li class="block p-2 hover:bg-gray-700 rounded">Settings</li>
        </ol>
        <!-- sidebar menu list end -->
      </div>
      <!-- sidebar end -->

      <!-- the main body content part -->
      <div class="flex-1 p-6">
        <!-- header start -->
        <div class="flex justify-between items-center mb-6">
          <div>
            <h1 class="text-2xl font-bold">Dashboard</h1>
            <p class="text-gray-400">Track and Manage the Tasks</p>
          </div>
          <button
            id="addBtn"
            class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-500 trasition"
          >
            + Add Task
          </button>
        </div>
        <!-- header end -->

        <!-- stats start -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          <div class="bg-white p-4 rounded shadow">
            Total
            <h2 id="total" class="text-xl font-bold">0</h2>
          </div>
          <div class="bg-white p-4 rounded shadow">
            In Progress
            <h2 id="inProgress">0</h2>
          </div>
          <div class="bg-white p-4 rounded shadow">
            Completed
            <h2 id="completed">0</h2>
          </div>
          <div class="bg-white p-4 rounded shadow text-red-500">
            Over Due
            <h2 id="overdue">0</h2>
          </div>
        </div>
        <!-- stats end -->

        <!-- controls start -->
        <div class="flex gap-3 mb-4">
          <input
            id="search"
            placeholder="Search..."
            class="border p-2 rounded w-full"
          />

          <select id="sort" class="border p-2 rounded">
            <option value="">Sort</option>
            <option value="name">Name</option>
            <option value="date">Date</option>
            <option value="priority">Priority</option>
          </select>
        </div>
        <!-- controls end -->

        <!-- tabs start -->
        <div class="flex gap-3 mb-4">
          <button data-tab="all" class="tab border-b-2 border-blue-500">
            All
          </button>
          <button data-tab="todo" class="tab">To Do</button>
          <button data-tab="in-progress" class="tab">In Progress</button>
          <button data-tab="done" class="tab">Completed</button>
        </div>
        <!-- tabs end -->

        <!-- task list start -->
        <div id="tasks" class="grid md:grid-cols-3 gap-4">
          <!-- array in js by focusing tasks id -->
        </div>

        <!-- task list end -->
      </div>
      <!-- the main body content part -->

      <!-- main home screen end -->
    </div>

    <!-- add task modal open and closing with poping up -->
    <!-- add task modal start -->
    <div
      id="modal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center"
    >
      <!-- moadl heading  -->
      <div class="bg-white p-6 rounded w-80 animate-scale">
        <h2 class="font-bold mb-3">Add Task</h2>

        <input
          id="name"
          placeholder="Task name"
          class="w-full border p-2 mb-2 rounded"
        />
        <textarea
          id="desc"
          placeholder="Description"
          class="w-full border p-2 mb-2 rounded"
        ></textarea>

        <select id="priority" class="w-full border p-2 mb-2 rounded">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <select id="status" class="w-full border p-2 mb-2 rounded">
          <option value="todo">To Do</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Completed</option>
        </select>

        <input type="date" id="date" class="w-full border p-2 mb-2 rounded" />

        <div class="flex justify-between mt-3">
          <button id="save" class="bg-blue-600 text-white px-3 py-1 rounded">
            Save
          </button>
          <button id="close" class="bg-gray-300 px-3 py-1 rounded">
            Cancel
          </button>
        </div>
      </div>

      <!-- moadl heading  -->
    </div>
    <!-- add task modal end -->

    <!-- link the custom script file -->
    <script src="script.js"></script>
  </body>
</html>
